name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install, build, and upload your site
        uses: withastro/action@v3
        with:
          # No committed lockfile yet (this repo was built without a local
          # Node.js install) — pin the package manager explicitly so the
          # action doesn't need to auto-detect one from a lockfile. Once
          # you run `npm install` locally and commit package-lock.json,
          # this can be removed and it'll use `npm ci` automatically.
          package-manager: npm@latest

  # Reports SEO problems (dead internal links, duplicate titles/descriptions,
  # missing canonicals, thin pages) without gating the deploy. Promote this to
  # a `needs:` dependency of `build` once you're happy it's clean and you want
  # a regression to block the release instead of just flagging it.
  seo-check:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install and build
        run: npm install --no-audit --no-fund && npm run build

      - name: Check SEO
        run: npm run check:seo

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
